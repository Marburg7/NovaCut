<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="novagrad" x1="20" y1="20" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="novabg" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="220" height="220" rx="48" fill="url(#novabg)"/>
  <rect x="1" y="1" width="218" height="218" rx="47" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="110" cy="110" r="50" fill="url(#novagrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Geometric NovaCut Cutting Wings / Stylized N -->
  <path d="M54 166V54L98 54L136 122V54H166V166H122L84 98V166H54Z" fill="url(#novagrad)"/>
  <!-- Dynamic Diagonal Cutting Slash -->
  <path d="M42 152L178 68" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="110" cy="110" r="10" fill="#FFFFFF"/>
</svg>
